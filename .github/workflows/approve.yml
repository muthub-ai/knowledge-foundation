name: approve

# When Muthu approves a pull request, stamp `verified: human:muthu` on the notes it changed (ADR 006).
# The commit is pushed with the GitHub App's token so the required checks run again on it.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  stamp:
    if: github.event.review.state == 'approved' && github.event.review.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.KF_APP_ID }}
          private-key: ${{ secrets.KF_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Stamp the notes this pull request changed
        run: |
          git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- wiki/ \
            | grep -v -e '^wiki/raw/' -e '/index.md$' -e '^wiki/log.md$' > changed.txt || true
          if [ -s changed.txt ]; then
            PYTHONPATH=tools python -m kb stamp --by human:muthu --at "${{ github.event.review.submitted_at }}" $(cat changed.txt)
          fi
          rm -f changed.txt
      - name: Commit the stamp
        run: |
          if git diff --quiet; then echo "nothing to stamp"; exit 0; fi
          git config user.name "knowledge-foundation[bot]"
          git config user.email "knowledge-foundation[bot]@users.noreply.github.com"
          git commit -am "Stamp verification: approved by Muthu"
          git push
